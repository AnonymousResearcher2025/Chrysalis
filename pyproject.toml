[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1", "pybind11==2.13.6"]
build-backend = "setuptools.build_meta"

[project]
name = "chrysalis"
version = "1.0.0"
description = "Certified in-place migration of vector indexes across embedding model versions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "torch==2.4.1",
    "transformers==4.48.3",
    "sentence-transformers==3.4.1",
    "pillow==11.1.0",
    "pyarrow==18.1.0",
    "requests==2.32.3",
    "grpcio==1.70.0",
    "boto3==1.35.99",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
gpu = ["faiss-gpu-cu12==1.13.0"]
cpu = ["faiss-cpu==1.13.0"]
baselines = ["einops==0.8.0", "pydantic==2.9.2", "pydantic-settings==2.6.0", "loguru==0.7.2", "pot==0.9.5",
             "psutil==6.1.0", "joblib==1.4.2", "pyyaml==6.0.2", "tqdm==4.67.1"]
test = ["pytest==8.3.3"]

[project.scripts]
chrysalis = "chrysalis.cli:main"

[tool.setuptools]
packages = ["chrysalis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
